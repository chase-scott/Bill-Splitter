<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roommate Bill Splitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Direction: fair, exact, a little warm. World: the receipt. Signature: the share bar. */
  :root{
    --bg:#f6f6f4; --surface:#fff; --sunk:#f0f0ed;
    --text:#1c1c1a; --text2:#5b5b57; --text3:#8c8c86;
    --line:rgba(28,28,26,.09); --line2:rgba(28,28,26,.16);
    --accent:#15803d; --accent-h:#166534; --accent-ink:#fff; --accent-soft:#eaf5ee; --accent-text:#15803d;
    --a:#3f9a5c; --b:#c95582; --c:#cf8f2c;
    --pos:#2f7d4a; --neg:#b9433b; --caution:#9a6a14;
    --paper:#fcfbf7; --ink:#262624; --ink2:#7a7974;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#121311; --surface:#1a1b19; --sunk:#161715;
      --text:#ececea; --text2:#a7a7a2; --text3:#76766f;
      --line:rgba(236,236,234,.08); --line2:rgba(236,236,234,.15);
      --accent:#3fbf6a; --accent-h:#55cc7c; --accent-ink:#0c1f12; --accent-soft:#1c2b20; --accent-text:#5fd084;
      --a:#6cc58a; --b:#de7fa4; --c:#e0aa55; --pos:#6cc98c; --neg:#e47d74; --caution:#d9ad5c;
      --paper:#f3f1ea; --ink:#262624; --ink2:#77756f;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 0}
  .m{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.93em}
  b{font-weight:500}
  p{margin:0 0 16px}
  .mute{color:var(--text2)}
  .small{font-size:13px}
  .center{text-align:center}
  .sp{flex:1}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .gap16{margin-bottom:16px}
  .ic{flex:none;display:block}
  .dot{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;margin-right:8px}
  h2{font-size:15px;font-weight:500;margin:0}
  .sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 12px}
  .lead{color:var(--text2);margin-bottom:20px}

  /* header */
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
  h1{font-size:17px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
  .logo{width:20px;height:20px;background:var(--accent);
    -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>') center/contain no-repeat;
            mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>') center/contain no-repeat}
  nav{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:2px}
  nav button{border:none;background:none;border-radius:8px;padding:4px 12px;font-size:13px;color:var(--text2);height:28px}
  nav button:hover:not(:disabled){background:none;color:var(--text)}
  nav button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line)}

  /* controls */
  button{font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:8px;padding:0 12px;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .1s var(--ease)}
  button:hover:not(:disabled){background:var(--sunk)}
  button:active:not(:disabled){transform:scale(.98)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500;padding:0 16px}
  button.pri:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
  button:disabled{opacity:.4;cursor:default}
  button.link{border:none;background:none;height:auto;padding:0;color:var(--accent-text);gap:4px}
  button.link:hover:not(:disabled){background:none;text-decoration:underline;text-underline-offset:3px}
  button.link.quiet{color:var(--text2)}
  kbd{font:11px/1 var(--mono);color:var(--text3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:2px 4px;min-width:16px;text-align:center;background:var(--surface)}
  input[type=text],input[type=number],input:not([type]){font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:0 12px;height:36px}
  input:focus{outline:none;border-color:var(--accent)}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .pin{position:relative;display:inline-flex;align-items:center}
  .pin input{padding-right:28px;text-align:right;width:100%}
  .pin span{position:absolute;right:12px;color:var(--text3);font-size:13px;pointer-events:none}
  .ok{color:var(--pos);font-size:13px;display:inline-flex;align-items:center;gap:4px}
  .ok::before{content:"";width:14px;height:14px;background:currentColor;
    -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>') center/contain no-repeat;
            mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>') center/contain no-repeat}
  .bad{color:var(--neg);font-size:13px}
  .note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--caution);margin:0 0 16px}
  .note .ic{margin-top:2px}
  .note .link{margin-left:auto}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin-bottom:20px}
  .spin{display:inline-block;width:12px;height:12px;border:1.5px solid var(--line2);border-top-color:var(--text2);border-radius:50%;animation:sp .8s linear infinite;margin-right:8px;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom));margin-top:32px;display:flex;gap:12px;align-items:center;z-index:6}

  /* signature: share bar */
  .sbar{display:flex;gap:2px;height:4px;border-radius:2px;overflow:hidden;width:100%}
  .sbar i{display:block;min-width:2px}
  .sbar.empty{background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
  .sbar.sm{height:2px;margin-top:6px;max-width:160px}
  .sbar.md{height:6px;border-radius:3px}
  .sbar.lg{height:8px;border-radius:4px}

  /* step 1 */
  .drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px dashed var(--line2);border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;margin-bottom:16px;background:var(--surface);color:var(--text2);font-size:13px;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
  .drop .ic{color:var(--text3);margin-bottom:4px}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .drop input{display:none}
  .drop b{font-size:15px;color:var(--text)}
  .thumbs{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  .th{position:relative;width:104px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
  .th img,.th .ph{display:block;width:104px;height:112px;object-fit:cover}
  .th .ph{background:var(--sunk)}
  .th .st{font-size:12px;padding:4px 8px;min-height:28px;display:flex;justify-content:space-between;gap:4px;align-items:center}
  .th .st.err{color:var(--neg)}
  .th .x{position:absolute;top:4px;right:4px;width:24px;height:24px;padding:0;justify-content:center;border-radius:6px;border:none;background:rgba(20,20,18,.6);color:#fff}
  .th .x:hover:not(:disabled){background:rgba(20,20,18,.8)}
  .rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .rc-h{display:flex;gap:8px;align-items:center;padding:8px 12px 8px 4px;border-bottom:1px solid var(--line)}
  .rc-h input{font-weight:500;border-color:transparent;flex:1;min-width:0;height:32px}
  .rc-h input:hover{border-color:var(--line)}
  .it{padding:8px 4px 8px 4px;border-bottom:1px solid var(--line)}
  .it1{display:flex;gap:4px;align-items:center}
  .it input{border-color:transparent;height:32px;padding:0 8px}
  .it input:hover{border-color:var(--line)}
  .it input.nm{flex:1;min-width:0;font-family:var(--mono);font-size:14px}
  .it input.pr{font-family:var(--mono);font-size:14px}
  .prw{position:relative;display:flex;align-items:center;flex:none}
  .prw i{position:absolute;left:8px;font-style:normal;font-family:var(--mono);font-size:14px;color:var(--text3);pointer-events:none}
  .it input.pr{width:104px;text-align:right;padding-left:20px}
  .it input::placeholder{color:var(--text3)}
  .it .x{border:none;background:none;color:var(--text3);width:32px;height:32px;padding:0;justify-content:center}
  .it .x:hover:not(:disabled){color:var(--neg);background:none}
  .it2{display:flex;gap:8px;align-items:center;padding:0 8px;flex-wrap:wrap;font-size:13px;color:var(--text3)}
  .it2 input.cd{height:24px;padding:0 4px;width:144px;color:var(--text2);font-size:12px;margin-left:-4px}
  .offv{display:flex;gap:8px;align-items:center;min-width:0;color:var(--text)}
  .pimg{display:inline-block;flex:none;background:#fff;border-radius:4px;border:1px solid var(--line)}
  .pimg.ph{background:var(--sunk)}
  .rc-f{display:flex;gap:8px;align-items:center;padding:12px 16px;font-size:13px;flex-wrap:wrap;background:var(--sunk)}

  .settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
  .settings summary{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;list-style:none;font-weight:500}
  .settings summary::-webkit-details-marker{display:none}
  .settings summary .ic{color:var(--text3)}
  .settings .sbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
  .settings label{font-size:13px;color:var(--text2)}
  .settings input,.settings .unused{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:0 12px;height:36px}
  .settings .small{margin:4px 0 0}
  /* step 2 */
  .prog{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:8px}
  .pbar{height:4px;background:var(--line);border-radius:2px;margin-bottom:24px;overflow:hidden}
  .pbar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:transform .3s var(--ease)}
  /* moment: the receipt slip */
  .slipwrap{filter:drop-shadow(0 1px 1px rgba(0,0,0,.06)) drop-shadow(0 8px 16px rgba(0,0,0,.06));margin:0 auto 24px;max-width:480px}
  .slip{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:14px;padding:20px 24px 32px;
    -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 8px repeat-x;
            mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 8px repeat-x}
  .slip-h{display:flex;justify-content:space-between;color:var(--ink2);font-size:12px;padding-bottom:12px;margin-bottom:16px;border-bottom:1px dashed rgba(38,38,36,.25)}
  .slip-l{display:flex;gap:16px;align-items:baseline;font-size:17px;font-weight:500}
  .slip-n{flex:1;word-break:break-word}
  .slip-p{font-variant-numeric:tabular-nums}
  .slip-c{color:var(--ink2);font-size:12px;margin-top:4px}
  .slip-m:empty{display:none}
  .slip-m{margin-top:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .slip-m .mute{color:var(--ink2)}
  .offcard{display:flex;gap:12px;align-items:center}
  .offcard .pimg{border-radius:6px;border-color:rgba(38,38,36,.12)}
  .pn{font-size:14px;font-weight:500}
  .slip-s{margin-top:20px;padding-top:16px;border-top:1px dashed rgba(38,38,36,.25)}
  .slip-who{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;font-size:13px;color:var(--ink2)}
  .slip-who span{display:inline-flex;align-items:center}
  .slip-who b{color:var(--ink);margin-left:8px;font-weight:500}
  .slip .sbar.empty{background:repeating-linear-gradient(90deg,rgba(38,38,36,.2) 0 4px,transparent 4px 8px)}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .presets button{height:auto;padding:12px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:8px 8px;text-align:left;align-items:start;border-color:var(--line);border-radius:12px}
  .presets button .sbar{grid-column:1/-1}
  .presets button .pl{display:flex;flex-direction:column;gap:0}
  .presets button .pl b{font-size:14px}
  .presets button .pl span{font-size:12px;color:var(--text2)}
  .presets button kbd{align-self:end}
  .presets .wide{grid-column:1/-1}
  .presets button.on,.navbtns button.on{border-color:var(--accent);background:var(--accent-soft)}
  .navbtns{display:flex;gap:8px;margin-bottom:16px;align-items:center}
  .navbtns button[data-move="-1"]{width:36px;padding:0;justify-content:center}
  .slip.editing .slip-s{border-top-style:solid}
  .cedit{display:flex;flex-direction:column;gap:4px;margin-top:12px}
  .crow{display:grid;grid-template-columns:auto 1fr 96px 80px;align-items:center;gap:8px;font-size:14px}
  .crow .dot{margin-right:0}
  .crow .pin input{height:32px;font-family:var(--mono);background:#fff;color:var(--ink);border-color:rgba(38,38,36,.2)}
  .crow .pin input::placeholder{color:rgba(38,38,36,.35)}
  .crow .pin input:focus{border-color:var(--accent)}
  .crow .pin span{color:var(--ink2)}
  .crow b{text-align:right;font-weight:500}
  .chint{font-size:12px;color:var(--ink2);margin-top:8px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .chint .bad{font-size:12px}
  /* feedback when a split is picked, then the next slip slides in */
  .sbar.grow i{transform-origin:left;animation:grow .35s var(--ease) both}
  .sbar.grow i:nth-child(2){animation-delay:.05s} .sbar.grow i:nth-child(3){animation-delay:.1s}
  @keyframes grow{from{transform:scaleX(0)}}
  .slipwrap.leave{animation:leave .16s ease-in forwards}
  .slipwrap.enter-r{animation:enter-r .22s var(--ease) both}
  .slipwrap.enter-l{animation:enter-l .22s var(--ease) both}
  @keyframes leave{to{opacity:0;transform:translateX(-24px)}}
  @keyframes enter-r{from{opacity:0;transform:translateX(24px)}}
  @keyframes enter-l{from{opacity:0;transform:translateX(-24px)}}
  .presets button.on{transition:none}
  @media (prefers-reduced-motion:reduce){.sbar.grow i,.slipwrap.leave,.slipwrap.enter-r,.slipwrap.enter-l{animation:none}}
  .running{margin-top:24px}
  .running .row{margin-bottom:8px}
  .rn{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:8px;font-size:13px;color:var(--text2)}
  .rn span{display:inline-flex;align-items:center}
  .rn b{color:var(--text);margin-left:8px}

  /* step 3 */
  .rpay{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .rpay:last-child{border-bottom:none}
  .rpay .n{flex:1;min-width:96px;font-weight:500}
  .seg{display:inline-flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:2px}
  .seg button{border:none;background:none;height:28px;padding:0 8px;font-size:13px;color:var(--text2);border-radius:8px;gap:0}
  .seg button .dot{margin-right:6px}
  .seg button:hover:not(:disabled){background:none;color:var(--text)}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--line)}
  .paid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .pd{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--text2)}
  .pd>span:first-child{display:flex;align-items:center}
  .money{position:relative;display:flex;align-items:center}
  .money i{position:absolute;left:12px;font-style:normal;color:var(--text3)}
  .money input{width:100%;padding-left:24px;text-align:right;font-size:15px;height:40px}
  .tally{display:grid;grid-template-columns:auto auto;justify-content:end;gap:4px 16px;font-size:13px;text-align:right;margin-bottom:16px}
  .tally #paidchk{grid-column:1/-1}
  .taxrow .pin{width:88px}

  /* step 4 */
  .stub .slip{padding-bottom:28px}
  .slip-r{display:flex;align-items:baseline;gap:8px;padding:4px 0}
  .slip-r i{flex:1;border-bottom:1px dotted rgba(38,38,36,.35);transform:translateY(-4px)}
  .slip-t{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(38,38,36,.25);color:var(--ink2)}
  .people{padding:16px}
  .people .sbar{margin-bottom:12px}
  .pt{display:grid;grid-template-columns:1fr repeat(3,96px);gap:8px;padding:8px 0;border-top:1px solid var(--line);text-align:right;align-items:center}
  .pt.ph{border-top:none;color:var(--text3);font-size:12px;padding:0 0 4px}
  .pt span:first-child{text-align:left;display:flex;align-items:center}
  .pos{color:var(--pos)} .neg{color:var(--neg)}
  table{border-collapse:separate;border-spacing:0;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
  th:first-child,td:first-child{text-align:left}
  thead th{position:sticky;top:0;z-index:5;background:var(--surface);font-size:12px;font-weight:400;color:var(--text3);white-space:nowrap;border-bottom:1px solid var(--line)}
  thead th:first-child{border-top-left-radius:12px} thead th:last-child{border-top-right-radius:12px}
  thead th .dot{margin-right:6px;vertical-align:1px}
  td.amt{white-space:nowrap;width:1%}
  td .pp{display:block;font-size:11px;color:var(--text3)}
  td.zero{color:var(--text3);opacity:.5}
  tr.sec td{background:var(--sunk);font-size:12px;color:var(--text2);padding:4px 12px}
  tbody tr.item{cursor:pointer}
  tbody tr.item:hover td{background:var(--sunk)}
  tr.un td:first-child::after{content:"Not split";display:block;color:var(--caution);font-size:12px;margin-top:4px}
  .offcell{display:flex;gap:8px;align-items:flex-start}
  .rt{display:block;font-size:11px;color:var(--text3);margin-top:2px}
  .rt0{font-size:13px}
  tfoot td{white-space:nowrap;color:var(--text2);border-bottom:none;padding:4px 12px}
  tfoot tr:first-child td{padding-top:12px}
  tfoot tr.big td{color:var(--text);font-weight:500;padding-bottom:12px}
  .ini{display:none}

  @media(max-width:640px){
    .wrap{padding:16px 16px 0}
    header{margin-bottom:20px}
    nav{width:100%}
    nav button{flex:1 1 0;justify-content:center;padding:0 4px}
    .presets{grid-template-columns:repeat(2,1fr)}
    .presets button kbd,.navbtns kbd{display:none}
    .paid{grid-template-columns:1fr}

<script>
const NAMES=['Chase','Michealah','Emily'], INI=['C','M','E'], COLORS=['var(--a)','var(--b)','var(--c)'];
const T=100/3;
const PRESETS=[
  {label:'Everyone',sub:'Split 3 ways',pct:[T,T,T]},
  {label:'Chase',sub:'100%',pct:[100,0,0]},
  {label:'Michealah',sub:'100%',pct:[0,100,0]},
  {label:'Emily',sub:'100%',pct:[0,0,100]},
  {label:'Chase + Michealah',sub:'50 / 50',pct:[50,50,0]},
  {label:'Chase + Emily',sub:'50 / 50',pct:[50,0,50]},
  {label:'Michealah + Emily',sub:'50 / 50',pct:[0,50,50]},
];
const PROMPT=`You are reading a photo of a store receipt. Extract every purchased line item.
Return ONLY a JSON object, no other text, in exactly this shape:
{"store":"<store name, or empty string>","items":[{"name":"<item text as printed>","code":"<product number printed on that line, digits only, or empty string>","price":<number>}],"subtotal":<pre-tax subtotal as a number, or null>}
Rules:
- code is the UPC / product / item number printed on the same line as the item (often 8-13 digits before or after the name). Copy every digit exactly; use "" if there is none.
- price is the final amount charged for that line, as a plain number without $ (e.g. 4.96).
- If a line has a discount, coupon or instant savings, subtract it from that item's price. If you can't tell which item it belongs to, add it as its own item with a negative price.
- Weighed items: keep the weight detail in the name, e.g. "BANANAS (1.470 kg @ $1.50/kg)".
- An item printed on two separate lines appears twice. If one line shows a quantity (e.g. "2 @ 3.97"), give one item with the line total and keep the quantity in the name.
- Include deposits and eco/environmental fees as items.
- Do NOT include subtotal, tax (HST/GST/PST), total, payment, change, points or savings-summary lines.
- If part of the receipt is unreadable, include only what you can read.`;

const KEY='roommate-split-app-v1';
let uid=1; const nid=()=>uid++;
function fresh(){return {step:1,receipts:[],cur:0,paid:['','',''],paidBy:{},tax:13};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.receipts)){uid=1+Math.max(0,...s.receipts.flatMap(r=>[r.id,...r.items.map(i=>i.id)]));s.paidBy=s.paidBy||{};return s;}}catch(e){}return null;}
let S=load()||fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=id=>document.getElementById(id);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cents=v=>Math.round(num(v)*100);
const $c=c=>(c<0?'-':'')+'$'+(Math.abs(c)/100).toFixed(2);
const pfmt=p=>{const r=Math.round(p*100)/100;return (Math.abs(r-T)<0.01?'33.3':String(r))+'%'};
const items=()=>S.receipts.flatMap(r=>r.items.map(it=>({...it,rc:r})));
const same=(a,b)=>a&&b&&a.every((v,i)=>Math.abs(v-b[i])<0.01);

// split a price (in cents) by percentages so the shares add up exactly
function shares(priceC,pct){
  if(!pct) return [0,0,0];
  const raw=pct.map(p=>priceC*p/100), fl=raw.map(Math.floor);
  let rem=priceC-fl.reduce((a,b)=>a+b,0);
  const ord=[0,1,2].sort((a,b)=>(raw[b]-fl[b])-(raw[a]-fl[a]));
  for(let k=0;rem>0;k=(k+1)%3,rem--) fl[ord[k]]++;
  return fl;
}
function totals(){
  const sub=[0,0,0]; let all=0, un=0, unN=0;
  items().forEach(it=>{const p=cents(it.price); all+=p; if(!it.pct){un+=p;unN++;return;} shares(p,it.pct).forEach((v,i)=>sub[i]+=v);});
  const rate=num(S.tax)/100, tax=sub.map(v=>Math.round(v*rate)), owes=sub.map((v,i)=>v+tax[i]);
  const paid=S.paid.map(cents), bal=paid.map((p,i)=>p-owes[i]);
  return {sub,tax,owes,paid,bal,all,allTax:Math.round(all*(1+rate)),un,unN};
}
function transfers(bal){
  const cr=bal.map((b,i)=>[i,b]).filter(x=>x[1]>0), db=bal.map((b,i)=>[i,-b]).filter(x=>x[1]>0), out=[];
  let ci=0,di=0;
  while(ci<cr.length&&di<db.length){
    const a=Math.min(cr[ci][1],db[di][1]); if(a>0) out.push([db[di][0],cr[ci][0],a]);
    cr[ci][1]-=a; db[di][1]-=a; if(cr[ci][1]<=0) ci++; if(db[di][1]<=0) di++;
  }
  return out;
}

/* ---------- Claude photo reading ---------- */
let sample=null, sampleState='loading', denied=false;
(async()=>{
  await null; // let the rest of the script finish first (no claude.ai runtime = no await below)
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      sample=await window.claude.use('sample');
      if(sample&&typeof sample.limits==='function'){
        try{const l=await sample.limits(); if(l&&l.images===false) sample=null;}catch(e){}
      }
    }
  }catch(e){sample=null}
  sampleState=sample?'ready':'none';
  if(S.step===1) render();
})();
/* ---------- Gemini (Google AI Studio) photo reader ---------- */
// The key is typed into the app and kept in this browser only. It is never part of this file.
const GK='roommate-gemini-v1'; let G={key:''};
try{G=Object.assign(G,JSON.parse(localStorage.getItem(GK))||{})}catch(e){}
const saveG=()=>{try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){}};
const GMODELS=['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-latest'];
function provider(){
  if(inClaude()) return sampleState==='loading'?'loading':sample?'claude':null;
  if(G.key) return 'gemini';
  return sampleState==='loading'?'loading':sample?'claude':null;
}
const canRead=()=>{const p=provider();return p==='gemini'||p==='claude';};
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej({message:"Couldn't read the photo"});r.readAsDataURL(blob);});
async function geminiRead(blob){
  const data=await b64(blob), mime=blob.type&&blob.type.startsWith('image/')?blob.type:'image/jpeg';
  const body=JSON.stringify({contents:[{role:'user',parts:[{text:PROMPT},{inline_data:{mime_type:mime,data}}]}],generationConfig:{temperature:0,responseMimeType:'application/json'}});
  const models=GMODELS;
  let last={message:'No answer'}, limited=false;
  for(const m of models){
    let r;
    try{ r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':G.key},body}); }
    catch(e){ throw {message:"Can't reach Google. Check your connection"}; }
    let j=null; try{ j=await r.json(); }catch(e){}
    const msg=j&&j.error&&j.error.message?String(j.error.message):'';
    if(r.ok){
      const parts=(j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
      const text=parts.map(x=>x.text||'').join('');
      if(!text){ last={message:(j&&j.promptFeedback&&j.promptFeedback.blockReason)?'Blocked by Google':'Empty answer'}; continue; }
      return text;
    }
    if(r.status===400&&/api key/i.test(msg)||r.status===401||r.status===403) throw {code:'bad_key',message:'Key rejected. Check it in Photo reading'};
    if(r.status===429){ limited=true; last={code:'rate_limited',message:'Free limit reached'}; continue; }
    if(r.status===404||r.status>=500){ last={message:msg||('Error '+r.status)}; continue; }
    throw {message:(msg||('Error '+r.status)).slice(0,80)};
  }
  throw limited?{code:'rate_limited',message:'Free limit reached. Try again in a minute'}:last;
}
let photos=[]; // {id,file,url,status,msg,rid}
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file), m=1800, sc=Math.min(1,m/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.85));
  }catch(e){return file}
}
function parseJSON(t){
  if(t&&typeof t==='object') return t;
  t=String(t||''); const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a) throw {message:"Couldn't read the receipt's answer"};
  return JSON.parse(t.slice(a,b+1));
}
async function readPhoto(p){
  p.status='reading'; p.msg=''; render();
  try{
    const img=await shrink(p.file);
    let v;
    if(provider()==='gemini') v=await geminiRead(img);
    else{
      const opts={images:[img],modelTier:'default',cache:false};
      if(typeof sample.json==='function') v=await sample.json(PROMPT,opts);
      else v=(await sample(PROMPT,opts)).text;
    }
    v=parseJSON(v);
    const its=(Array.isArray(v.items)?v.items:[]).map(it=>({id:nid(),name:String(it.name||'Item').trim(),code:String(it.code??'').replace(/\D/g,''),price:(Math.round(num(it.price)*100)/100).toFixed(2),pct:null}));
    if(!its.length) throw {message:'No items found'};
    const n=S.receipts.length+1, store=String(v.store||'').trim();
    const rc={id:nid(),name:store||('Receipt '+n),items:its,subtotal:v.subtotal==null||v.subtotal===''?null:num(v.subtotal)};
    S.receipts.push(rc); p.status='done'; p.rid=rc.id; save(); queueLookups();
  }catch(e){
    p.status='error';
    if(e&&e.code==='not_granted'){denied=true;p.msg='Permission not given';}
    else if(e&&e.code==='bad_key'){p.msg=e.message;}
    else if(e&&e.code==='rate_limited'){p.msg='Busy - retry in a moment';}
    else p.msg=(e&&e.message)?String(e.message).slice(0,60):"Couldn't read";
    render(); return e&&e.code;
  }
  render();
}
let reading=false;
async function readAll(){
  if(reading||!canRead()) return; reading=true;
  for(const p of photos.filter(p=>p.status==='new'||p.status==='error')){
    const code=await readPhoto(p);
    if(code==='rate_limited'||code==='not_granted'||code==='bad_key') break;
  }
  reading=false; render();
}
const TW=208, TH=224; // thumbnail canvas, shown at 104x112
async function pixThumb(file){
  try{
    const bmp=await createImageBitmap(file), c=document.createElement('canvas'); c.width=TW; c.height=TH;
    const x=c.getContext('2d'), sc=Math.max(TW/bmp.width,TH/bmp.height), w=bmp.width*sc, h=bmp.height*sc;
    x.imageSmoothingEnabled=true; x.drawImage(bmp,(TW-w)/2,(TH-h)/2,w,h);
    return c.toDataURL('image/png');
  }catch(e){return URL.createObjectURL(file)}
}
function addFiles(list){
  [...list].filter(f=>/^image\//.test(f.type)||/\.(heic|heif)$/i.test(f.name)).forEach(f=>{
    const p={id:nid(),file:f,url:'',status:'new'}; photos.push(p);
    pixThumb(f).then(u=>{p.url=u; if(S.step===1) render();});
  });
  render();
}


/* ---------- Open Food Facts lookup ---------- */
// Works wherever the page may reach openfoodfacts.org (e.g. self-hosted). Inside claude.ai the
// browser blocks the request, so lookups switch off and the receipt text is used instead.
let lookupState='unknown'; // unknown | ok | blocked
const gtinCheck=b=>{let s=0;for(let i=b.length-1,w=3;i>=0;i--,w=4-w)s+=(+b[i])*w;return (10-s%10)%10};
const gtinValid=d=>d.length>=8&&gtinCheck(d.slice(0,-1))===+d.slice(-1);
function candidates(d){
  if(d.length===14&&d[0]==='0') d=d.slice(1);
  const out=[], add=x=>{if(x&&!out.includes(x)) out.push(x)};
  if(gtinValid(d)){ add(d); if(d.length<13) add(d.padStart(13,'0')); }
  else{ if(d.length<=12) add(d+gtinCheck(d)); add(d); }   // receipts often drop the check digit
  return out.slice(0,3);
}
const okImg=u=>typeof u==='string'&&/^https:\/\/(images|static)\.openfoodfacts\.org\//.test(u)?u:'';
// Lookups: cached per code in this browser; ONE batched search request per round of up to 30 items
// (search limit 10/min). No per-item requests.
const OFFKEY='off-cache-v1'; let offCache={};
try{offCache=JSON.parse(localStorage.getItem(OFFKEY))||{}}catch(e){}
const saveCache=()=>{try{localStorage.setItem(OFFKEY,JSON.stringify(offCache))}catch(e){}};
const FIELDS='code,product_name,product_name_en,generic_name,brands,quantity,image_front_small_url,image_small_url';
const norm=c=>String(c||'').replace(/^0+/,'');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const inClaude=()=>!!(window.claude&&typeof window.claude.use==='function')||/(^|\.)claude(usercontent)?\.(ai|com)$/.test(location.hostname);
let offFails=0, offStrikes=0, offBusy=false, offWaitUntil=0, lastSearch=0, lastProd=0, offTimer=null, offMsg='';
function setOffMsg(m){offMsg=m; const el=$('offmsg'); if(el) el.textContent=m;}
function toOff(pr,c){
  const name=String(pr.product_name_en||pr.product_name||pr.generic_name||'').trim(), img=okImg(pr.image_front_small_url||pr.image_small_url);
  if(!name&&!img) return null;
  return {name:name.slice(0,80),brand:String(pr.brands||'').split(',')[0].trim().slice(0,40),qty:String(pr.quantity||'').slice(0,20),img,code:String(c)};
}
function setFound(it,o){it.off=o; it.offs='found'; offCache[it.code]=o; upd(it);}
function setNone(it){delete it.off; it.offs='none'; offCache[it.code]=0; upd(it);}
const pendingItems=()=>S.receipts.flatMap(r=>r.items).filter(it=>it.code&&it.code.length>=8&&(!it.offs||it.offs==='pending'));
function queueLookups(){
  if(lookupState==='blocked') return;
  S.receipts.forEach(r=>r.items.forEach(it=>{
    if(it.code&&it.code.length>=8&&!it.offs&&offCache[it.code]!==undefined){ offCache[it.code]?setFound(it,offCache[it.code]):setNone(it); }
  }));
  save(); runOff();
}
function waitFor(sec,why){
  offWaitUntil=Date.now()+sec*1000;
  pendingItems().forEach(it=>{ if(it.offs==='pending'){ delete it.offs; upd(it);} });
  clearInterval(offTimer);
  offTimer=setInterval(()=>{
    const left=Math.ceil((offWaitUntil-Date.now())/1000);
    if(left<=0){clearInterval(offTimer); offTimer=null; runOff();}
    else setOffMsg(`${why} - trying again in ${left}s`);
  },1000);
}
async function offGet(url){
  try{ const r=await fetch(url); offFails=0; return r; }
  catch(e){
    // Inside claude.ai the page is simply not allowed to reach other sites.
    if(inClaude()&&lookupState!=='ok'){ lookupState='blocked'; pendingItems().forEach(it=>delete it.offs); setOffMsg(''); render(); return null; }
    // Anywhere else this is usually a rate-limit reply without CORS headers, or no internet: back off and retry.
    offFails++;
    const local=location.protocol==='file:';
    waitFor(Math.min(300,15*2**(offFails-1)), offFails>=3
      ? `Can't reach Open Food Facts${local?' (if you opened this file from Files or a download preview, that viewer has no internet: open it in Safari or Chrome, or host it)':''}`
      : 'Open Food Facts didn\'t answer');
    return null;
  }
}
async function runOff(){
  if(offBusy||lookupState==='blocked'||offWaitUntil>Date.now()) return;
  const batch=pendingItems().slice(0,30);
  if(!batch.length){ setOffMsg(''); return; }
  offBusy=true;
  try{
    batch.forEach(it=>{it.offs='pending'; upd(it);});
    // 1) one batched search for every candidate form of every code
    const map={}, codes=new Set();
    batch.forEach(it=>candidates(it.code).forEach(c=>{
      [c,c.length<13?c.padStart(13,'0'):null].filter(Boolean).forEach(x=>codes.add(x));
      (map[norm(c)]=map[norm(c)]||[]).push(it);
    }));
    const gap=7000-(Date.now()-lastSearch); if(gap>0){ setOffMsg('Waiting to look up products...'); await sleep(gap); }
    setOffMsg(`Looking up ${batch.length} product${batch.length>1?'s':''} on Open Food Facts...`);
    lastSearch=Date.now();
    const r=await offGet(`https://world.openfoodfacts.org/api/v2/search?code=${[...codes].join(',')}&fields=${FIELDS}&page_size=100`);
    if(!r) return;
    lookupState='ok';
    if(r.status===429||r.status===503){
      const ra=parseInt(r.headers.get('Retry-After'),10); offStrikes++;
      waitFor(Math.min(300,Math.max(isFinite(ra)&&ra>0?ra:60,30*2**(offStrikes-1))),'Open Food Facts asked us to slow down'); return;
    }
    offStrikes=0;
    let j=null; if(r.ok){ try{ j=await r.json(); }catch(e){} }
    if(!r.ok||!j){ // some other failure: stop, do not retry item by item
      batch.forEach(it=>{ if(it.offs==='pending'){ delete it.offs; upd(it);} });
      setOffMsg('Product lookup failed. Edit a code to try again'); return;
    }
    (Array.isArray(j.products)?j.products:[]).forEach(pr=>{
      const o=toOff(pr,pr.code); if(!o) return;
      (map[norm(pr.code)]||[]).forEach(it=>{ if(it.offs==='pending') setFound(it,o); });
    });
    // anything the batch did not return is simply not in the database: no per-item requests
    batch.forEach(it=>{ if(it.offs==='pending') setNone(it); });
    save(); saveCache();
  }finally{ offBusy=false; }
  if(pendingItems().some(it=>!it.offs)) runOff(); else setOffMsg('');
}
const dname=it=>it.off&&it.off.name?it.off.name:it.name;
function pimg(url,a){ return url?`<canvas class="pimg" width="${a*4}" height="${a*4}" data-img="${esc(url)}" style="width:${a*2}px;height:${a*2}px"></canvas>`:`<span class="pimg ph" style="width:${a*2}px;height:${a*2}px"></span>`; }
function offHtml(it,mode){
  const o=it.off, sub=o?[o.brand,o.qty].filter(Boolean).join(' · '):'';
  if(mode==='row'){
    if(it.offs==='pending') return '<span class="spin"></span><span class="mute">Looking up</span>';
    if(o) return `${pimg(o.img,10)}<span>${esc(o.name||'Unnamed product')}${sub?` <span class="mute">${esc(sub)}</span>`:''}</span>`;
    if(it.offs==='none') return '<span class="mute">Not in Open Food Facts</span>';
    return '';
  }
  if(mode==='card'){
    if(o) return `<div class="offcard">${pimg(o.img,24)}<div><div class="pn">${esc(o.name||'Unnamed product')}</div>${sub?`<div class="mute small">${esc(sub)}</div>`:''}</div></div>`;
    if(it.offs==='pending') return '<div class="offcard mute small"><span class="spin"></span>Looking up product</div>';
    return '';
  }
  if(o) return `<span class="offcell">${pimg(o.img,12)}<span>${esc(o.name||it.name)}<span class="rt m">${esc(it.name)}</span></span></span>`;
  return `<span class="rt0 m">${esc(it.name)}</span>`;
}
function upd(it){
  document.querySelectorAll(`[data-off="${it.id}"]`).forEach(el=>el.innerHTML=offHtml(it,el.dataset.mode));
  hydrate();
}
const imgCache={};
function hydrate(){
  document.querySelectorAll('canvas.pimg[data-img]:not([data-done])').forEach(cv=>{
    cv.dataset.done=1; const u=cv.dataset.img;
    const draw=im=>{const a=cv.width,x=cv.getContext('2d'),sc=Math.max(a/im.naturalWidth,a/im.naturalHeight),w=im.naturalWidth*sc,h=im.naturalHeight*sc;
      x.fillStyle='#fff';x.fillRect(0,0,a,a);x.imageSmoothingEnabled=true;x.drawImage(im,(a-w)/2,(a-h)/2,w,h);};
    let c=imgCache[u];
    if(!c){c=imgCache[u]={im:new Image(),ok:false,wait:[]}; c.im.onload=()=>{c.ok=true;c.wait.forEach(f=>f());c.wait=[]}; c.im.onerror=()=>{c.wait=[]}; c.im.src=u;}
    if(c.ok) draw(c.im); else c.wait.push(()=>{if(cv.isConnected) draw(c.im)});
  });
}
S.receipts.forEach(r=>r.items.forEach(it=>{if(it.offs==='pending') delete it.offs;}));

/* ---------- views ---------- */
const ICONS={
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  left:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  right:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',

function vSplit(){

  <div class="navbtns">

    <span class="sp"></span>
    ${customOpen?`<button class="pri" id="csave">Save split${ic('right')}</button>`
      :`<button data-move="1">${S.cur<L.length-1?(cur?'Next':'Skip'):'Finish'}${ic('right')}</button>`}
  </div>

    <div class="rn">${NAMES.map((n,i)=>`<span>${dot(i)}${n}<b class="m">${$c(t.sub[i])}</b></span>`).join('')}</div></div>

  if(customOpen) setTimeout(updCustom,0);
  return h;
}
// Custom split: type any boxes; empty boxes share whatever is left
function customValues(){
  const raw=[0,1,2].map(i=>{const el=document.querySelector(`[data-cp="${i}"]`);return el?el.value.trim():''});
  const typed=raw.map(v=>v===''?null:Math.max(0,num(v)));
  const used=typed.reduce((a,v)=>a+(v||0),0), blanks=typed.filter(v=>v===null).length, rest=100-used;
  const v=typed.map(x=>x===null?(blanks?Math.max(0,rest)/blanks:0):x);
  const valid=blanks?rest>=-0.005:Math.abs(used-100)<0.01;
  return {v,typed,valid,used,rest,blanks};
}
function updCustom(){
  if(!$('csum')) return;
  const L=items(), it=L[S.cur], pc=cents(it.price), c=customValues();
  const sh=c.valid?shares(pc,c.v):c.v.map(p=>Math.round(pc*p/100));
  c.v.forEach((p,i)=>{
    const el=document.querySelector(`[data-cp="${i}"]`); if(el) el.placeholder=c.typed[i]===null?String(Math.round(p*10)/10):'0';
    $('camt'+i).textContent=$c(sh[i]);
  });
  $('csbar').innerHTML=sbar(c.valid?c.v:null,'lg');
  $('csum').innerHTML=c.valid?"Leave a box empty to share what's left"
    :`<span class="bad">${c.blanks?`That's ${Math.round(c.used*100)/100}%, over 100%`:`Adds up to ${Math.round(c.used*100)/100}%, needs 100%`}</span>`;
  const sv=$('csave'); if(sv) sv.disabled=!c.valid;
}
// Pick a split: show it on the slip, pause, then move on
function choose(pct){
  if(advancing) return;
  const L=items(), it=L[S.cur], real=S.receipts.flatMap(r=>r.items).find(x=>x.id===it.id);
  real.pct=pct; customOpen=false; save();
  justSet=true; render();
  advancing=true;
  const last=S.cur>=L.length-1, rm=reduceMotion();
  advTimer=setTimeout(()=>{
    const w=$('slipwrap'); if(w&&!rm) w.classList.add('leave');
    advTimer=setTimeout(()=>{ advancing=false; advTimer=null;
      if(last){ go(3); return; }
      S.cur++; enterDir=1; save(); render();
    }, rm?0:160);
  }, rm?250:650);
}
function cancelAdvance(){ if(advTimer){clearTimeout(advTimer); advTimer=null;} advancing=false; }
function setPct(pct){ choose(pct); }

function vSummary(){
  const t=totals(), tr=transfers(t.bal), rate=num(S.tax), pe=t.paid.reduce((a,b)=>a+b,0), owesAll=t.owes.reduce((a,b)=>a+b,0);

  h+=`<div class="slipwrap stub"><div class="slip">

  const fr=(l,arr,cls='',tot='')=>`<tr class="${cls}"><td>${l}</td><td class="amt m">${tot}</td>${arr.map(v=>`<td class="amt m">${v}</td>`).join('')}</tr>`;

  return h;
}

/* ---------- events ---------- */
const findIt=id=>{for(const r of S.receipts){const it=r.items.find(x=>x.id==id); if(it) return [r,it];} return [];};
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-jump]'); if(!t) return;
  const d=t.dataset;
  if(d.go){go(+d.go);return;}
  if(t.id==='readall'){readAll();return;}
  if(d.retry){const p=photos.find(x=>x.id==d.retry); if(p&&!reading){reading=true;await readPhoto(p);reading=false;render();} return;}
  if(d.rmphoto){photos=photos.filter(x=>x.id!=d.rmphoto);render();return;}
  if(d.rmit){for(const r of S.receipts){r.items=r.items.filter(x=>x.id!=d.rmit);} save(); render(); return;}
  if(d.additem){const r=S.receipts.find(x=>x.id==d.additem); r.items.push({id:nid(),name:'',code:'',price:'',pct:null}); save(); render();
    setTimeout(()=>{const ins=document.querySelectorAll(`[data-rc="${r.id}"] input.nm`); ins[ins.length-1]&&ins[ins.length-1].focus();},0); return;}
  if(d.rmrc){ if(t.dataset.arm){S.receipts=S.receipts.filter(x=>x.id!=d.rmrc); photos=photos.filter(p=>p.rid!=d.rmrc); save(); render();}
    else{t.dataset.arm=1;t.textContent='Tap again to remove';setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent='Remove';}},3000);} return;}
  if(t.id==='manual'){S.receipts.push({id:nid(),name:'Receipt '+(S.receipts.length+1),items:[{id:nid(),name:'',code:'',price:'',pct:null}],subtotal:null}); save(); render(); return;}
  if(t.id==='startover'){ if(t.dataset.arm){S=fresh(); photos=[]; save(); render(); window.scrollTo(0,0);}
    else{t.dataset.arm=1;t.textContent='Tap again to clear everything';setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent='Start over';}},3000);} return;}
  if(d.preset!==undefined){ customOpen=false; choose(PRESETS[+d.preset].pct.slice()); return; }
  if(d.showcustom!==undefined){ if(advancing) return; customOpen=!customOpen; render(); if(customOpen){const f=document.querySelector('[data-cp="0"]'); f&&f.focus();} return; }
  if(t.id==='csave'){ const c=customValues(); if(!c.valid) return; const pi=PRESETS.findIndex(p=>same(p.pct,c.v)); customOpen=false; choose(pi>=0?PRESETS[pi].pct.slice():c.v); return; }
  if(d.move){ cancelAdvance(); const L=items().length, n=S.cur+(+d.move); if(n>=L){go(3);return;} if(n<0) return; S.cur=n; enterDir=+d.move; save(); render(); return; }
  if(d.pby){const [rid,i]=d.pby.split(':').map(Number);
    if(S.paidBy[rid]===i) delete S.paidBy[rid]; else S.paidBy[rid]=i;
    const rate=num(S.tax)/100, sums=[0,0,0];
    S.receipts.forEach(rc=>{if(S.paidBy[rc.id]!==undefined){sums[S.paidBy[rc.id]]+=Math.round(rc.items.reduce((a,it)=>a+cents(it.price),0)*(1+rate));}});
    S.paid=sums.map(c=>c?(c/100).toFixed(2):''); save(); render(); return;}
  if(d.jump!==undefined){S.cur=+d.jump; customFor=null; go(2); return;}
  if(d.firstun!==undefined){const i=items().findIndex(x=>!x.pct); S.cur=Math.max(0,i); go(2); return;}
  if(t.id==='copy'){
    const T2=totals(), tr=transfers(T2.bal);
    const txt=NAMES.map((n,i)=>`${n}: share ${$c(T2.owes[i])} (items ${$c(T2.sub[i])} + tax ${$c(T2.tax[i])}), paid ${$c(T2.paid[i])}`).join('\n')
      +'\n\n'+(tr.length?tr.map(([f,to,a])=>`${NAMES[f]} pays ${NAMES[to]} ${$c(a)}`).join('\n'):'Everyone is settled up.');
    try{await navigator.clipboard.writeText(txt);t.innerHTML=ic('check')+'Copied';}catch(err){t.textContent='Copy blocked';}
    setTimeout(()=>t.innerHTML=ic('copy')+'Copy summary',1500); return;}
});
document.addEventListener('toggle',e=>{ if(e.target.id==='settings') settingsOpen=e.target.open; },true);
document.addEventListener('input',e=>{
  const el=e.target, d=el.dataset;
  if(el.id==='gkey'){G.key=el.value.trim(); saveG(); const g=$('gstat'); if(g) g.textContent=G.key?'Google Gemini':(sample?'Claude':'Not set up'); return;}
  if(el.id==='file'){addFiles(el.files); el.value=''; return;}
  if(d.f){const [r,it]=findIt(el.closest('[data-it]').dataset.it); if(d.f==='code'){it.code=el.value.replace(/\D/g,''); delete it.off; delete it.offs; save(); return;} it[d.f]=el.value; save(); $('rcf-'+r.id).innerHTML=rcFoot(r); return;}
  if(d.rcname!==undefined){const r=S.receipts.find(x=>x.id==el.closest('[data-rc]').dataset.rc); r.name=el.value; save(); return;}
  if(d.cp!==undefined){updCustom(); return;}
  if(d.paid!==undefined){S.paid[+d.paid]=el.value; save(); updPaidChk(); return;}
  if(el.id==='tax'){S.tax=el.value; save(); return;}
});
document.addEventListener('change',e=>{ if(e.target.id==='gkey') render(); if(e.target.id==='tax') render(); if(e.target.dataset.f==='code'){const [,it]=findIt(e.target.closest('[data-it]').dataset.it); upd(it); queueLookups();} });
document.addEventListener('keydown',e=>{
  if(S.step!==2) return;
  if(e.target.matches('input')){ if(e.key==='Enter'&&e.target.dataset.cp!==undefined&&$('csave')&&!$('csave').disabled) $('csave').click(); if(e.key==='Escape'&&e.target.dataset.cp!==undefined){customOpen=false;render();} return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(/^[1-7]$/.test(e.key)){e.preventDefault(); customOpen=false; choose(PRESETS[+e.key-1].pct.slice());}
  else if(e.key==='8'){e.preventDefault(); document.querySelector('[data-showcustom]').click();}
  else if(e.key==='ArrowRight'){const b=document.querySelector('[data-move="1"]'); b&&b.click();}
  else if(e.key==='ArrowLeft'&&S.cur>0){document.querySelector('[data-move="-1"]').click();}
});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop'); if(d){e.preventDefault(); d.classList.add('over');}}));
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop'); if(d) d.classList.remove('over');});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop'); if(d){e.preventDefault(); addFiles(e.dataTransfer.files);}});

render();
queueLookups();
</script>
</body>
</html>
